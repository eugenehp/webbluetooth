[workspace]
resolver = "2"
members = [
    "crates/webbluetooth-core",
    "crates/webbluetooth-apple",
    "crates/webbluetooth-android",
    "crates/webbluetooth-linux",
    "crates/webbluetooth-node",
    "crates/webbluetooth-wasm",
    "crates/webbluetooth-windows",
    "crates/webbluetooth",
]

[workspace.package]
version    = "0.0.1"
edition    = "2021"
license    = "MIT"
repository = "https://github.com/eugenehp/webbluetooth"
homepage   = "https://github.com/eugenehp/webbluetooth"
authors    = ["Eugene Hauptmann"]
# The toolchain this is developed and tested against. Nothing here reaches for
# anything newer, but nothing checks an older one either, so this is a claim
# about what is verified rather than about what might happen to work.
rust-version = "1.94"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
missing_transmute_annotations = "warn"

[profile.release]
lto       = true
codegen-units = 1
