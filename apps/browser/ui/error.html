<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Can’t reach that page</title>
    <link rel="stylesheet" href="error.css" />
  </head>
  <body>
    <main>
      <h1>Can’t reach that page</h1>
      <p id="reason" class="reason"></p>
      <p class="url"><code id="url"></code></p>
      <ul class="hints">
        <li>Check the address for a typo.</li>
        <li>Check that this machine is online.</li>
        <li>The site may be down, or blocking this browser.</li>
      </ul>
      <button id="retry">Try again</button>
    </main>
    <script src="error.js"></script>
  </body>
</html>
